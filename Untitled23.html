<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 23 - Bảng tính lương</title>
    <style>
        table, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Lương</td>
            <td><input type="number" id="luong" value="1000000"></td>
        </tr>
        <tr>
            <td>Hệ số lương</td>
            <td><input type="number" id="heSo" step="0.1" value="3.2"></td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <button onclick="tinhLuong()">Tính lương tháng</button>
            </td>
        </tr>
        <tr>
            <td>Lương tháng</td>
            <td><input type="number" id="luongThang" readonly></td>
        </tr>
    </table>

    <script>
        function tinhLuong() {
            let l = parseFloat(document.getElementById("luong").value);
            let hs = parseFloat(document.getElementById("heSo").value);
            document.getElementById("luongThang").value = l * hs;
        }
    </script>
</body>
</html>
